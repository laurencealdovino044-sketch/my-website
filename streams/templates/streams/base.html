<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}DJI Stream Manager{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'streams:dashboard' %}">DJI RTMP Manager</a>
        <div class="d-flex">
            {% if request.user.is_authenticated %}
                <a href="{% url 'streams:stream-list' %}" class="btn btn-outline-light btn-sm me-2">Streams</a>
                <form method="post" action="{% url 'streams:logout' %}">
                    {% csrf_token %}
                    <button class="btn btn-danger btn-sm" type="submit">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'streams:login' %}" class="btn btn-outline-light btn-sm">Login</a>
            {% endif %}
        </div>
    </div>
</nav>

<main class="container pb-5">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>
        {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
</main>

{% block scripts %}{% endblock %}
</body>
</html>
