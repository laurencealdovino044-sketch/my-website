{% load static widget_tweaks %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #e8f4f8;  /* Soft light blue background */
            padding-top: 50px;
            font-family: 'Arial', sans-serif;
        }

        .form-container {
            max-width: 500px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        }

        .form-container h2 {
            margin-bottom: 30px;
            text-align: center;
            color: #6f42c1;  /* Purple for headings */
            font-size: 2.5rem;
            font-weight: bold;
        }

        .form-container .form-label {
            font-weight: 600;
            color: #333;  /* Dark text for better readability */
        }

        .form-control {
            border-radius: 10px;
            border: 2px solid #ddd;  /* Light border */
            transition: border-color 0.3s ease, box-shadow 0.3s ease;  /* Smooth transition */
        }

        .form-control:focus {
            border-color: #6f42c1;  /* Purple border on focus */
            box-shadow: 0 0 10px rgba(111, 66, 193, 0.5);  /* Glow effect */
        }

        .btn-custom {
            background-color: #6f42c1;  /* Purple button */
            color: white;
            border: none;
            width: 100%;
            border-radius: 10px;
            padding: 12px;
            font-size: 1.2rem;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .btn-custom:hover {
            background-color: #5a32a1;  /* Darker purple on hover */
            transform: translateY(-3px);  /* Slight lift effect */
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #6f42c1;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .form-control:focus,
        .btn-custom:focus {
            outline: none;
        }
    </style>
</head>
<body>

    <div class="container form-container">
        <h2>Sign Up</h2>
        <form method="POST">
            {% csrf_token %}
            
            <!-- Username Field -->
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                {{ form.username|add_class:"form-control" }}
            </div>    
            <!-- Password Field -->
            <div class="mb-3">
                <label for="password1" class="form-label">Password</label>
                {{ form.password1|add_class:"form-control" }}
            </div>
            
            <!-- Confirm Password Field -->
            <div class="mb-3">
                <label for="password2" class="form-label">Confirm Password</label>
                {{ form.password2|add_class:"form-control" }}
            </div>

            <button type="submit" class="btn btn-custom">Sign Up</button>
        </form>
        <div class="login-link">
            <p>Already have an account? <a href="{% url 'login' %}">Login</a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
